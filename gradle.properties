# The daemon needs more metaspace than the default: the Kotlin compiler and
# the documentation/quality plugins load a large number of classes in a run.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=768m
# Reuse task outputs between runs: the interpreter sources change far less
# often than the build is run.
org.gradle.caching=true
